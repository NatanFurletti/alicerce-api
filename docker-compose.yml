services:
  # A aplicação completa com um comando: `docker compose up`.
  # Para desenvolver com hot reload, suba só os bancos:
  #   docker compose up -d postgres postgres-test
  app:
    build: .
    container_name: alicerce-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    # Valores fixos de propósito, sem interpolar o .env: o DATABASE_URL de lá aponta
    # para localhost, que dentro do container é o próprio container. Na rede do
    # compose, o banco é alcançado pelo nome do serviço.
    environment:
      # `development` aceita os segredos abaixo; em `production` o loadEnv exigiria
      # segredos reais, e subir localmente deixaria de ser um comando só.
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://alicerce:alicerce@postgres:5432/alicerce?schema=public
      # Apenas para uso local. Produção usa segredos gerados pelo Render (render.yaml).
      JWT_ACCESS_SECRET: segredo-local-de-acesso-apenas-para-docker-compose
      JWT_REFRESH_SECRET: segredo-local-de-refresh-apenas-para-docker-compose

  postgres:
    image: postgres:16-alpine
    container_name: alicerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alicerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alicerce}
      POSTGRES_DB: ${POSTGRES_DB:-alicerce}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - alicerce-pgdata:/var/lib/postgresql/data
    healthcheck:
      # Sem healthcheck o CI tenta migrar antes de o Postgres aceitar conexão.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-alicerce} -d ${POSTGRES_DB:-alicerce}']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    container_name: alicerce-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alicerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alicerce}
      POSTGRES_DB: ${POSTGRES_DB:-alicerce}_test
    ports:
      - '${POSTGRES_TEST_PORT:-5433}:5432'
    # tmpfs: banco de teste vive em memória e morre com o container.
    # Rápido e garante que nenhum teste e2e escreva no banco de desenvolvimento.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-alicerce} -d ${POSTGRES_DB:-alicerce}_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  alicerce-pgdata:
